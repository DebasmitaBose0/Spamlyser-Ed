version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - model_cache:/root/.cache/huggingface
      - spamlyser_data:/app/data
    environment:
      - SPAMLYSER_MODEL_CACHE_DIR=/root/.cache/huggingface/transformers
      - SPAMLYSER_DATA_DIR=/app/data
      - SPAMLYSER_ENABLE_TELEMETRY=false
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  model_cache:
  spamlyser_data:
